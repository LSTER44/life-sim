<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟人生:中国式人生 · 网页版</title>
<style>
:root{
  --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364;
  --card:rgba(16,34,44,.82); --card2:rgba(255,255,255,.06);
  --gold:#f5c877; --text:#eef4f6; --dim:#8fa8b3; --line:rgba(245,200,119,.28);
  --red:#ff6b6b; --green:#51cf66; --purple:#cc5de8; --yellow:#ffd43b; --cyan:#22b8cf;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  color:var(--text); min-height:100vh;
  background-attachment:fixed;
}
body::before{content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 80% -10%, rgba(245,200,119,.14), transparent 60%),
             radial-gradient(ellipse 50% 35% at 10% 110%, rgba(34,184,207,.12), transparent 60%);}
#app{max-width:1280px; margin:0 auto; padding:18px 20px 28px; position:relative;}
h1{font-size:22px; letter-spacing:3px; text-align:center; margin-bottom:4px; color:var(--gold);
   text-shadow:0 0 18px rgba(245,200,119,.35);}
.subtitle{text-align:center; color:var(--dim); font-size:12px; letter-spacing:6px; margin-bottom:14px;}
#layout{display:grid; grid-template-columns:280px 1fr; gap:14px; align-items:start;}
@media (max-width:860px){#layout{grid-template-columns:1fr;}}
/* ---------- 左栏状态面板 ---------- */
#panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 15px;
  position:sticky; top:14px; box-shadow:0 10px 30px rgba(0,0,0,.35);}
#pTitle{font-size:17px; font-weight:700; color:var(--gold); margin-bottom:2px;}
#pSub{font-size:12px; color:var(--dim); margin-bottom:12px;}
.attr{margin-bottom:9px;}
.attr .lbl{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:3px;}
.attr .lbl b{color:var(--text); font-weight:600;}
.bar{height:9px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:5px; transition:width .6s cubic-bezier(.22,.9,.35,1.1);}
#pMoney{margin-top:12px; font-size:18px; font-weight:700; color:var(--gold);}
#pMoney small{font-size:11px; color:var(--dim); font-weight:400; margin-left:4px;}
#pInfo{margin-top:10px; font-size:12.5px; line-height:1.9; color:#cfe0e6;}
#pInfo .tag{display:inline-block; background:rgba(245,200,119,.15); border:1px solid rgba(245,200,119,.4);
  color:var(--gold); border-radius:20px; padding:0 9px; margin:1px 2px 1px 0; font-size:11.5px;}
/* ---------- 右栏 ---------- */
#right{min-width:0; display:flex; flex-direction:column; gap:12px;}
#ageBar{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 16px;
  display:flex; align-items:center; gap:14px;}
#ageNum{font-size:26px; font-weight:800; color:var(--gold); min-width:74px;}
#stageChip{font-size:12px; background:rgba(34,184,207,.18); border:1px solid rgba(34,184,207,.5);
  color:#8ee7f4; border-radius:20px; padding:2px 12px;}
#yearProg{flex:1; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;}
#yearProg i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--gold)); transition:width .3s;}
#log{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  height:calc(100vh - 260px); min-height:340px; overflow-y:auto; scroll-behavior:smooth;}
#log::-webkit-scrollbar{width:8px;} #log::-webkit-scrollbar-thumb{background:rgba(245,200,119,.25); border-radius:4px;}
.year{display:flex; align-items:center; gap:10px; margin:18px 0 10px;}
.year .yr{font-size:13.5px; font-weight:700; color:var(--gold); white-space:nowrap;}
.year .rule{flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent);}
.ev{font-size:14px; line-height:1.85; padding:3px 0 3px 12px; color:#dfeaee;}
.ev.major{border-left:3px solid var(--gold); background:rgba(245,200,119,.07); border-radius:0 8px 8px 0; padding:7px 12px; margin:7px 0; font-size:14.5px;}
.ev.danger{border-left:3px solid var(--red); background:rgba(255,107,107,.08); border-radius:0 8px 8px 0; padding:7px 12px; margin:7px 0;}
.ev.good{border-left:3px solid var(--green);}
.ev.love{border-left:3px solid var(--purple);}
.ev.money{border-left:3px solid var(--yellow);}
.ev.dim{color:var(--dim); font-size:13px;}
/* ---------- 动作区(可点击按钮) ---------- */
#action{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);}
#action .prompt{font-size:14px; color:var(--gold); margin-bottom:11px; font-weight:600;}
#btns{display:flex; flex-wrap:wrap; gap:10px;}
.btn{
  cursor:pointer; border:1px solid rgba(245,200,119,.45); background:linear-gradient(180deg,rgba(245,200,119,.13),rgba(245,200,119,.05));
  color:var(--text); border-radius:10px; padding:10px 15px; font-size:14px; font-family:inherit; text-align:left;
  transition:transform .12s, background .2s, box-shadow .2s; line-height:1.5; max-width:100%;
}
.btn:hover{transform:translateY(-2px); background:linear-gradient(180deg,rgba(245,200,119,.3),rgba(245,200,119,.12));
  box-shadow:0 6px 18px rgba(245,200,119,.22); border-color:var(--gold);}
.btn:active{transform:translateY(0);}
.btn .no{color:var(--gold); font-weight:800; margin-right:6px;}
.btn.yes{border-color:rgba(81,207,102,.6); background:linear-gradient(180deg,rgba(81,207,102,.15),rgba(81,207,102,.05));}
.btn.yes:hover{border-color:var(--green); box-shadow:0 6px 18px rgba(81,207,102,.25);}
.btn.no-btn{border-color:rgba(255,107,107,.5); background:linear-gradient(180deg,rgba(255,107,107,.12),rgba(255,107,107,.04));}
.btn.no-btn:hover{border-color:var(--red); box-shadow:0 6px 18px rgba(255,107,107,.22);}
.btn.cont{border-color:rgba(34,184,207,.55); background:linear-gradient(180deg,rgba(34,184,207,.16),rgba(34,184,207,.05));}
.btn.cont:hover{border-color:var(--cyan); box-shadow:0 6px 18px rgba(34,184,207,.25);}
.btn.wide{width:100%; text-align:center;}
/* ---------- 启动页/结算页 ---------- */
#layout.solo{grid-template-columns:minmax(0,640px); justify-content:center;}
.overlay{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:34px 30px; text-align:center; margin:0 auto;}
.overlay h2{color:var(--gold); font-size:24px; letter-spacing:4px; margin-bottom:16px;}
.overlay p{color:#cfe0e6; font-size:14px; line-height:2;}
.bigbtn{margin-top:22px; font-size:17px; padding:13px 46px; letter-spacing:3px;}
.record{font-size:13.5px; color:#cfe0e6; text-align:left; line-height:2.1;}
.record b{color:var(--gold); font-weight:600; margin-right:8px;}
#foot{text-align:center; color:var(--dim); font-size:11.5px; margin-top:10px; letter-spacing:1px;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.ev,.year{animation:fadein .35s ease;}
</style>
</head>

const rnd = {
  f(){return Math.random();},
  i(a,b){return a + Math.floor(Math.random()*(b-a+1));},   // [a,b] 闭区间
  pick(arr){return arr[Math.floor(Math.random()*arr.length)];},
  chance(p){return Math.random() < p;},
  uni(a,b){return a + Math.random()*(b-a);},
  shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd.i(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;},
  sampleN(arr,n){return rnd.shuffle([...arr]).slice(0,Math.min(n,arr.length));},
};
const clamp = (v,a=0,b=100)=>Math.max(a,Math.min(b,v));

/* ================================================================ 玩家 */
class Life{
  constructor(snap){
    Object.assign(this, snap || {});
    if(!snap){
      this.intel=rnd.i(20,92); this.health=rnd.i(45,98); this.look=rnd.i(15,95);
      this.family=rnd.i(1,10); this.luck=rnd.i(10,95); this.talent=rnd.i(1,10);
      this.money=0; this.age=-1; this.gender=rnd.pick(["男","女"]);
      this.name=rnd.pick(SURNAMES)+rnd.pick(this.gender==="男"?GIVEN_M:GIVEN_F);
      this.stage="婴幼儿"; this.hsType=null; this.uni=null; this.uniTier=0;
      this.edu=0; this.eduTier=0; this.job=null; this.lastJob=null; this.jobLevel=0; this.salary=0;
      this.retired=false; this.pension=0; this.spouse=null; this.marryReady=false;
      this.baoyan=false; this.gradTarget=null; this.married=false; this.kids=0;
      this.house=0; this.houseDebt=0; this.car=false; this.insurance=0;
      this.fame=0; this.happy=50; this.tags=[]; this.cd=new Set(); this.score=0;
      this.city=null; this.cityPrice=0; this.house2=false; this.parentsAlive=true; this.kidsTalent=0; this.kidsIntel=0;
      this.gjj=0; this.license=false; this.priceIdx=1.0; this.carePlan=null; this.widowed=false;
      this.phdOffered=false; this.postdoc=0; this.pet=null; this.petAge=0; this.funUsed=0; this.jobHuntMod=1; this.jobYears=0;
      this.funCounts={}; this.jobTag=null; this.houseTag=null; this.gapUsed=false; this.served=false; this.hometown=false; this.milBranch=null; this.milRank=0; this.milYears=0; this.milInRank=0; this.milMerit=0;
      this.familyWealth=0; this.studentDebt=0;
      this.bornTs=Date.now();
      this.dead=false; this.deathReason=""; this.records=[];
    }
  }
  clampStats(){this.health=clamp(this.health);this.happy=clamp(this.happy);this.intel=clamp(this.intel);
    this.look=clamp(this.look);this.luck=clamp(this.luck);this.talent=clamp(this.talent,1,10);}
  gain(v){this.money=+(this.money+(+v||0)).toFixed(1); if(this.money<0)this.money=0;}
  log(t){this.records.push([this.age,t]);}
  tag(t){if(!this.tags.includes(t))this.tags.push(t);}
}

/* 从候选池随机抽 n 条(乱序),支持 cond 条件;效果统一带随机抖动 */
function pickOptions(l, pool, n){
  const cand=pool.filter(o=>!o.cond || o.cond(l));
  return rnd.shuffle(cand).slice(0, Math.min(n, cand.length));
}
function jz(l, v, j){return Math.round(v + rnd.uni(-j,j));}   // 数值抖动

/* ================================================================ 交互原语(可点击) */
function renderBtns(prompt, btns){
  $("action").style.display="";
  $("prompt").innerHTML=prompt||"";
  const box=$("btns"); box.innerHTML="";
  btns.forEach(b=>{
    const el=document.createElement("button");
    el.className="btn "+(b.cls||"")+(b.wide?" wide":"");
    el.innerHTML=b.html;
    el.onclick=()=>{ if(AUTO)return; box.querySelectorAll("button").forEach(x=>x.disabled=true); b.cb(); };
    box.appendChild(el);
  });
  if(AUTO){
    setTimeout(()=>{ btns[rnd.i(0,btns.length-1)].cb(); }, SPEED);
    const tk=document.createElement("button");
    tk.className="btn no-btn"; tk.style.fontSize="12.5px"; tk.innerHTML="🖱️ 接管这局";
    tk.title="停止自动演示,改由你手动点选";
    tk.onclick=()=>{ AUTO=false; tk.remove(); };
    box.appendChild(tk);
  }
}
function hideAction(){$("action").style.display="none";}

let _resolvePending=null;
function chooseBtn(prompt, options){   // options:[{label, val, cls}]
  return new Promise(res=>{
    const btns=options.map((o,i)=>({html:`<span class="no">${i+1}</span>${esc(o.label)}`, cls:o.cls||"", cb:()=>res(o.val)}));
    renderBtns(prompt, btns);
  });
}
async function askYN(prompt, yesRate=.5){
  return new Promise(res=>{
    renderBtns(prompt, [
      {html:"是 ✓", cls:"yes", cb:()=>res(true)},
      {html:"否 ✗", cls:"no-btn", cb:()=>res(false)},
    ]);
    if(AUTO)setTimeout(()=>res(rnd.chance(yesRate)), SPEED);
  });
}
async function continueBtn(text){
  return new Promise(res=>{
    renderBtns("", [{html:"▶ 继续", cls:"cont wide", cb:()=>res()}]);
    if(AUTO)setTimeout(res, 40);
  });
}

/* ================================================================ 死亡与结算 */
function die(l,reason){l.dead=true; l.deathReason=reason;}
function checkSuddenDeath(l,w){
  let p=.0035*w; p*=(1.6-l.luck/100*.9); p*=(1.5-l.health/100*.7);
  if(rnd.chance(p)){
    const [desc,fat]=rnd.pick(SUDDEN_DEATH_POOL);
    if(rnd.chance(fat)){ evD(`⚡ <b>突发事件</b> —— ${esc(desc)}`); die(l,"意外/突发疾病"); return true;}
    evD(`⚡ <b>有惊无险</b> —— ${esc(desc.split("。")[0])}……你活了下来,大难不死。`);
    l.health-=10; l.log("经历重大意外,大难不死");
  }
  return false;
}
function rollSmallEvent(l,chance){
  if(rnd.chance(chance)){
    const [t,fx]=rnd.pick(SMALL_EVENTS);
    evDim(t); if(fx)fx(l);
  }
}
async function opportunityEvent(l){
  if(l.age<6||l.age>105)return;
  if(!rnd.chance(.34))return;
  const pool=OPPORTUNITIES.filter(o=>!o.when||o.when(l));
  if(!pool.length)return;
  const o=rnd.pick(pool);
  const opts=rnd.shuffle(o.opts.filter(x=>x.fx));
  if(opts.length<2)return;
  evM(`🧭 ${o.text}`);
  const pick=await chooseBtn(null,opts.map((x,i)=>({label:x.label,val:i})));
  opts[pick].fx(l);
}

async function lifeDecision(l){
  if(l.age<18||!rnd.chance(.3))return;
  const pool=LIFE_DECISIONS.filter(o=>!o.when||o.when(l));
  if(!pool.length)return;
  const o=rnd.pick(pool);
  const opts=rnd.shuffle(o.opts.filter(x=>x.fx));
  if(!opts.length)return;
  evM(`🧩 ${o.text}`);
  const pick=await chooseBtn(null,opts.map((x,i)=>({label:x.label,val:i})));
  opts[pick].fx(l);
}

async function examZhongkao(l){
  const luckRoll=rnd.pick(["超常","正常","正常","正常","失常"])[0];
  const sc=Math.max(150,Math.min(750, Math.round(l.intel*5.5+rnd.i(-60,60)+120+(luckRoll==="超"?rnd.i(25,60):luckRoll==="失"?-rnd.i(25,60):0))));
  l.score=sc;
  evM(`📝 中考成绩公布:<b style="color:var(--gold)">${sc} 分</b>(满分 750)。${luckRoll==="超"?"你超常发挥!":luckRoll==="失"?"可惜那天状态不好……":""}`);
  const opts=[];
  if(sc>=640)opts.push({label:"重点高中(市一中/省实验)·升学率之王,压力大",val:"key"});
  if(sc>=560)opts.push({label:"五年一贯制大专(3+2)·直接锁定大专",val:"zhuan5"});
  if(sc>=520)opts.push({label:"普通高中·中规中矩,一切皆有可能",val:"normal"});
  if(sc>=380)opts.push({label:"民办高中·学费贵,但肯学也有出路",val:"private"});
  opts.push({label:"技校/中专·早学一门技术也是路",val:"tech"});
  if(sc<380 && l.family>=7)opts.push({label:"出国读高中·家里出得起这笔钱",val:"abroad"});
  const pick=await chooseBtn("结合成绩和家境,你的志愿是?",opts);
  l.hsType=pick;
  const cost={key:1,normal:0,private:6,abroad:60,tech:0,zhuan5:3}[pick]; l.gain(-cost);
  if(pick==="key"){l.stage="高中(重点)";evM("🎓 你踏进重点高中,走廊贴满清北录取红榜。");l.log("考入重点高中");}
  else if(pick==="normal"){l.stage="高中(普通)";evM("🎓 你进入普通高中,老师说不输重点,关键看自己。");l.log("考入普通高中");}
  else if(pick==="private"){l.stage="高中(民办)";evM("🎓 你进入民办高中,爸妈交学费时笑容有点僵硬。");l.log("考入民办高中");}
  else if(pick==="abroad"){l.stage="高中(海外)";l.intel+=5;evM("🌍 你只身飞往国外读高中,孤独与成长一起来。");l.log("出国读高中");}
  else if(pick==="zhuan5"){l.stage="五年制大专";l.edu=5;l.eduTier=1;evM("🏛️ 你进了五年制大专,毕业拿大专文凭,不用再卷高考。");l.log("进入 3+2 五年制大专");}
  else{l.stage="技校";evM("🛠️ 你选了技校,学新能源汽车/烹饪/数控,手比脑子先毕业。");l.log("进入技校学习");}
}

const HOT_MAJOR=["计算机","电子信息","自动化","金融","临床医学","法学","数学"];
const COLD_MAJOR=["哲学","历史","社会学","材料","生物","化学","环境","土木"];
async function getJob(l){
  evS(`💼 开始投简历!学历:${EDU_NAMES[l.edu]} · 出身:${l.uni||"无"}${l.major?" · 专业:"+l.major:""}`);
  let pool=(JOBS_BY_TIER[Math.min(4,l.eduTier||l.uniTier)]||JOBS_BY_TIER[0]).slice();
  if(l.edu>=7)pool=pool.concat(JOBS_ADVANCED);
  /* 随机抽取 3-4 个岗位,薪资随机浮动 ±20%;10% 概率刷出一个高一档的惊喜 offer */
  let offers=rnd.sampleN(pool, rnd.i(3,5)).map(j=>({name:j[0], pay:+(j[1]*rnd.uni(.8,1.3)).toFixed(1)}));
  const upTier=(l.eduTier||l.uniTier)+1;
  if(upTier<=4 && rnd.chance(.10+(l.major&&HOT_MAJOR.includes(l.major)?.08:0)+(l.tags.includes("退伍军人")?.08:0))){
    const surprise=rnd.pick(JOBS_BY_TIER[upTier]);
    offers.push({name:surprise[0]+"(破格录取!)", pay:+Math.min(surprise[1]*rnd.uni(.9,1.2),50).toFixed(1)});
  }
  if(rnd.chance(.6)&&pool.length){
    const tg=rnd.pick([["996","(996,钱多伤身)",1.2],["remote","(远程办公,生活平衡)",0.95],["soe","(国企编,稳字当头)",0.85],["startup","(创业公司,画饼+期权)",0.9],["sales","(销售岗,底薪低提成猛)",0.7]]);
    const j=rnd.pick(pool);
    offers.push({name:j[0]+" "+tg[1], pay:+(j[1]*rnd.uni(.9,1.2)*tg[2]).toFixed(1), tag:tg[0]});
  }
  if(l.family>=8){
    offers.push({name:"回家继承家业/进自家公司", pay:60}); l.familyBiz=true;
  }
  let jname=null, base=0, guq=0, jtag=null;
  while(jname===null){
    const pick=await chooseBtn("收到的 offer 里,你签了哪份?",offers.map((o,i)=>({label:`${o.name} (起薪 ${o.pay} 万/年)`,val:i})));
    const o=pick<offers.length?offers[pick]:offers[0];
    if(!o.name.startsWith("回家")){
      const roll=rnd.f();
      if(roll<0.08&&guq<2){
        guq++; l.gain(0.5);
        evD(`😤 意外:你刚签完字,${o.name}临时缩编,offer 被鸽了。HR 赔了 0.5 万违约金,你重新打开招聘软件。`);
        l.log("offer被毁约");
        offers=rnd.sampleN(pool,rnd.i(2,3)).map(j=>({name:j[0], pay:+(j[1]*rnd.uni(.8,1.15)).toFixed(1)}));
        continue;
      }
      if(roll<0.13&&l.records.some(r=>/裁员|亏本|炒币/.test(r[1]))){
        o.pay=+(o.pay*.85).toFixed(1);
        evD("背调电话打到了上家,评语很微妙。对方:'机会可以给,薪资得重新谈。'");
      }else if(roll<0.20){
        o.pay=+(o.pay*.9).toFixed(1);
        evS("HR 把'13 薪''期权'说得天花乱坠,入职你才发现是画饼——先按 9 折理解。");
      }
    }
    jname=o.name; base=o.pay; jtag=o.tag||null;
  }
  if(jname.startsWith("回家")){
    evN("你进了自家公司,工资象征性,分红看年份,不是年年都有。"); l.gain(25); l.log("进自家公司");
    jname="自家公司管理者"; base=60;
  }
  if(l.major&&HOT_MAJOR.includes(l.major)){base=+(base*1.1).toFixed(1);}
  if(l.jobHuntMod!==1){base=+(base*l.jobHuntMod).toFixed(1); l.jobHuntMod=1;}
  l.job=jname; l.salary=base; l.jobLevel=1; l.jobYears=0;
  l.jobTag=(function(){const m=jname.match(/\((996|remote|soe|startup|sales)/);return m?m[1]:(jtag||null);})();
  l.stage=jname.startsWith("自家公司")?"自家公司":"职场";
  l.log(`成为${jname},年薪${base}万`);
  evM(`💼 你入职:<b>${esc(jname)}</b>,年薪 <span style="color:var(--gold)">${base} 万</span>。工位很小,梦想先放一放。`);
}

        l.gain(win); l.log("毕业创业成功"); l.tag("创业明星");

function assetFlows(l){
  if(l.house===2&&l.houseDebt>0){
    const pay=Math.min(l.houseDebt,+((l.cityPrice||100)*.05).toFixed(1));
    l.gain(-pay); l.houseDebt=+(l.houseDebt-pay).toFixed(1);
    if(l.houseDebt<=0.01){l.houseDebt=0;l.house=1;l.happy+=8;
      evM("🎊 房贷自动扣满结清!那天你专门去打了结清证明。"); l.log("房贷结清");}
  }
  if(l.house2){
    l.gain(+Math.min((l.cityPrice||100)*(l.priceIdx||1)*.02,3.5).toFixed(1));   // 租金随行情,封顶3.5万
    if(rnd.chance(.35)){const t=+Math.min(6,(l.cityPrice||100)*(l.priceIdx||1)*.005).toFixed(1);l.gain(-t);evDim(`🏠 多套房房产税试点扩大,今年缴了 ${t} 万。`);}
  }
  if(l.insurance){l.gain(-1); if(l.insurance===2)l.gain(-0.6);}
  // 夫妻共同财务:配偶也有收入
  if(l.married && (l.salary||l.pension))l.gain(+Math.max(2,(l.salary||l.pension)*.05).toFixed(1));
  // 物价上涨:现金放久了购买力缩水
  if(l.age>=26 && l.money>20)l.gain(-+(l.money*.015).toFixed(1));
  // 父母帮衬:工作头几年家里偶尔补贴(家境>=6)
  if(l.parentsAlive && l.family>=6 && l.salary>=12 && l.age>=26 && l.age<=45 && l.age%5===0){
    const amt=+rnd.uni(2,6).toFixed(1);
    if((l.familyWealth||0)>=amt){ l.familyWealth=+(l.familyWealth-amt).toFixed(1); l.gain(amt);
      evDim("爸妈又接济了你一笔(从家庭账本里划的),你嘴上嫌弃,到账很诚实。"); }
  }
  // 楼市有涨有跌:纸面财富开始波动
  l.priceIdx=+(((l.priceIdx||1) + rnd.uni(-.05,.06)).toFixed(3));
  if(l.priceIdx>1.55&&rnd.chance(.12)){l.priceIdx-=.15; evDim("📢 '房住不炒'新政落地,小区挂牌价回调了。");}
  if(l.priceIdx<.7&&rnd.chance(.10)){l.priceIdx+=.12; evDim("📢 降首付降利率,楼市暖了一些。");}
  l.priceIdx=Math.max(.5,Math.min(1.9,l.priceIdx));
  // 生活成本:柴米油盐、水电物业、人情往来(按城市分档)
  if(["职场","自家公司","体制内","自由职业","退休"].includes(l.stage)&&l.age>=18){
    const cf=l.city&&l.city.includes("一线")?1.6:(l.city&&(l.city.includes("二线")||l.city.includes("环京")))?1.2:(l.city&&l.city.includes("县城"))?.8:1.1;
    const kidCost=l.age>=50?l.kids*.2:l.kids*1.1;
    const cost=(1.6+kidCost+(l.married?.9:0))*cf*(1+Math.max(0,l.age-25)*.012);
    l.gain(-+(l.stage==="退休"?cost*.7:l.stage==="服役"?cost*.15:cost).toFixed(1));
  }
  // 医疗大支出:年龄越大越频繁;百万医疗报得多,重疾险少一半
  if(rnd.chance(l.age>=82?.20:l.age>=72?.13:l.age>=60?.09:.06)){
    let cost=rnd.pick([.5,1,2,5,12,25].concat(l.age>=72?[45]:[]));
    if(l.insurance===2)cost=Math.max(.3,cost*.3); else if(l.insurance)cost=Math.max(.5,cost/2);
    l.gain(-+cost.toFixed(1)); evD(`🏥 一场病/一次住院,医保报销后自付 ${cost.toFixed(1)} 万。`); l.log("医疗大支出");
  }
  // 养老方案年度效应
  if(l.carePlan==="nanny")l.gain(-6);
  if(l.carePlan==="home"){l.gain(-2);l.health+=1;}
  if(l.carePlan==="kids"&&rnd.chance(.4))l.happy+=2;
  if(l.carePlan==="kids"&&rnd.chance(.15)){l.happy-=3;evDim("儿媳/女婿的一个眼神,你假装没看懂。");}
  if(l.carePlan==="alone"&&rnd.chance(.15)){l.happy-=3;evDim("一个人生了场小病,好了才想起来给孩子打电话。");}
  if(l.carePlan==="alone"&&rnd.chance(.08)){l.health-=5;evD("深夜低血糖,你摸黑找糖,那一刻特别希望有人在。");}
  // 家庭账本:父母还在工作就有收入进家庭账户
  if(l.parentsAlive&&(l.age<=59)){
    const fin=[.5,1,2,3,5,8,12,20,40,80][l.family-1]||1;
    l.familyWealth=+((l.familyWealth||0)+fin*life_income_factor(l)).toFixed(1);
  }
  // 助学贷款:毕业赚钱后按季度硬扣
  if(l.studentDebt>0&&(l.stage==="职场"||l.stage==="自家公司"||l.stage==="体制内"||l.stage==="自由职业")){
    const pay=+(Math.min(l.studentDebt, l.studentDebt*.3+.3)).toFixed(1);
    l.gain(-pay); l.studentDebt=+(l.studentDebt-pay).toFixed(1);
    if(l.studentDebt<=0.01){l.studentDebt=0;evM("🎓 助学贷款还清了!你把结清短信截了图,存进了'人生高光'相册。");l.log("还清助学贷款");}
    else evDim(`助学贷款月供扣款 ${pay} 万,余 ${l.studentDebt} 万。`);
  }
  // 兴趣变现:自媒体与摄影的被动收入
  if(l.tags.includes("小主播"))l.gain(+(l.fame*.03).toFixed(1));
  if(l.tags.includes("摄影博主"))l.gain(+(l.fame*.02).toFixed(1));
  // 毛孩子的日常
  if(l.pet){
    l.happy+=2;
    if(rnd.chance(.06)){l.gain(-.3);evDim(`🐱 ${l.pet}生了场小病,宠物医院一趟小几百。`);}
    if(rnd.chance(.035)){evD(`💔 陪了你 ${Math.max(1,l.age-(l.petAge||l.age))} 年的${l.pet}老了,走了。你把它埋在楼下花坛,种了棵小花。`);l.happy-=8;l.log("宠物离世");l.pet=null;}
  }
  // 儿女的孝顺
  if(l.age>=60&&l.kids&&rnd.chance(.55)){
    l.gain(+rnd.uni(.3,1.2).toFixed(1));
    evDim(rnd.pick(["儿女寄来的水果比超市新鲜,红包塞在橘子底下。","孙子录了段视频祝寿,你转发了三个群。","女儿买了按摩仪,你嘴上说乱花钱,天天用。","儿子把你接去小住,亲家母抢着做饭。"]));
  }
  if(l.age>=60&&l.kids&&rnd.chance(.12)){evL("全家福拍了新的,你被安排在正中间,像一枚镇纸。");l.happy+=5;}
}

    }else if(l.stage==="职场"&&rnd.chance(l.jobTag==="soe"?.01:.03)){

    }else if(l.age>=35 && l.stage==="职场" && l.jobLevel<3 && rnd.chance(l.jobTag==="soe"?.015:.05)){
      await layoffFlow(l,"✂️ '组织架构调整',你上了优化名单。35 岁的简历多半石沉大海。");
    }

  }
  else if(l.stage==="体制内"){

    if(rnd.chance(.12+l.intel/600) && l.salary<45){

async function loveYear(l){
  if(l.married||l.spouse||l.age<18)return;
  // 越上年纪越难"遇见":中年靠介绍,老年靠儿女支持搭伴
  let ch = l.age<=35 ? 0.25 : (l.age<=50 ? 0.10 : (l.age<=60 ? 0.05 : (l.widowed ? 0.12 : 0.015)));
  if(l.stage==="服役")ch*=0.2;   // 部队管理严格,恋爱靠缘分和探亲
  ch+=l.look/600+l.fame/800;
  if(!rnd.chance(ch))return;
  const scene=rnd.pick(loveScenes(l));
  evL(`💘 ${scene},你遇见了一个人。`);
  if(!await askYN("你要确立关系吗?",.7)){evS("你把话咽了回去。后来 TA 去了别的城市。");return;}
  const okChance = l.age<=35 ? .45+l.look/250+l.fame/400+(l.salary>=15?.15:0)
                   : l.age<=60 ? .35+(l.house>=1?.15:0)+((l.salary||l.pension)>=10?.1:0)+l.look/600
                   : .55+(l.pension>=3?.1:0)+((l.kids&&l.kids>0)?.05:0);
  if(!rnd.chance(okChance)){
    evD(l.age<=35?"被发了好人卡。你回家听了一宿歌。":"聊了三次,对方礼貌地不再回消息。");
    l.happy-=4; return;
  }
  l.spouse=rnd.pick(SURNAMES)+rnd.pick(l.gender==="男"?GIVEN_F:GIVEN_M);
  l.log(`与${l.spouse}确立关系`); evL(`❤️ TA 叫 <b>${l.spouse}</b>。你们在一起了。`); l.happy+=12;
  if(rnd.chance(.3)){
    evDim("· 你们为'过年回谁家'吵了人生第一架。"); l.happy-=3;
    if(rnd.chance(.25)){evD("你们分手了,TA 把东西寄了回来。");l.spouse=null;l.log("恋爱无疾而终");return;}
  }
  if(l.salary>=10||l.family>=6||rnd.chance(.3))l.marryReady=true;
}

function funMeet(l,scene){
  if(l.married||l.spouse||l.age<18||l.age>50)return;
  if(!rnd.chance(.14))return;
  l.spouse=rnd.pick(SURNAMES)+rnd.pick(l.gender==="男"?GIVEN_F:GIVEN_M);
  l.marryReady=true; l.happy+=8;
  evL(`💘 ${scene}时认识了 <b>${l.spouse}</b>,聊得意外投机——你们交换了微信。`);
  l.log(`在${scene}认识${l.spouse}`);
}
function funMilestone(l,key,cnt){
  if(key==="🏃"&&cnt===3){l.tag("健身达人");l.health+=3;evM("🏅 成就解锁【健身达人】:三年举铁,体脂率肉眼可见地讲道理了。");}
  if(key==="📚"&&cnt===3){l.intel+=4;l.tag("博览群书");evM("🏅 成就解锁【博览群书】:什么话题都能接上,饭局地位 +1。");}
  if(key==="📷"&&cnt===3){l.fame+=8;l.tag("摄影博主");evM("🏅 成就解锁【摄影博主】:约拍排到下个月,副业比主业像样。");}
  if(key==="🎮"&&cnt===4){l.intel-=2;l.health-=2;l.happy-=4;evD("你盯着凌晨四点的屏幕突然清醒:好像有点上头了。你忍痛卸载了两个游戏。");}
  if(key==="✈️"&&cnt===5){l.fame+=6;l.tag("行走的攻略库");evM("🏅 成就解锁【行走的攻略库】:朋友们出去玩都找你要行程表。");}
  if(key==="🎸"&&cnt===3){l.talent+=2;l.tag("拿手乐器");evM("🏅 成就解锁【一技之长】:年会 solo 那段,台下实习生眼神都变了。");}
  if(key==="💻"&&cnt===3){l.fame+=6;l.tag("小主播");evM("🏅 成就解锁【小主播】:直播间常驻 200 人,广告主开始私信你。");}
  if(key==="🏕️"&&cnt===3){l.fame+=4;l.tag("露营玩家");evM("🏅 成就解锁【露营玩家】:装备越买越多,天台都搭过天幕了。");}
}

async function funPanel(l){
  const srcPool=l.age<18?KID_FUN:FUN_ITEMS;
  const items=srcPool.filter(f=>(!f.cond||f.cond(l))&&(!f.need||f.need(l))&&(l.age>=(f.minA||18)));
  if(!items.length){evDim("想放松一下,但钱包和日程都不允许。");l.funUsed=1;return;}
  const pick=await chooseBtn("🎮 本年的娱乐时间——想怎么放松?",items.map((f,i)=>({label:f.label,val:i})));
  const it=items[pick];
  it.fx(l); l.funUsed=1;
  const key=it.label.slice(0,2);
  l.funCounts[key]=(l.funCounts[key]||0)+1;
  funMilestone(l,key,l.funCounts[key]);
}
async function continueBtn(l){
  while(true){
    const act=await new Promise(res=>{
      const btns=[{html:"▶ 长一岁", cls:"cont wide", cb:()=>res("next")}];
      if(l&&!l.funUsed&&!l.dead)btns.push({html:"🎮 娱乐一下(本年限一次)",cls:"",cb:()=>res("fun")});
      renderBtns("",btns);
    });
    if(act==="next")return;
    await funPanel(l);
  }
}

async function layoffFlow(l,reason){
  evD(reason);
  l.log("遭遇裁员"); l.health-=5; l.happy-=12;
  const sev=l.salary||10;
  const opts=[
    {label:"立刻重新投简历,一天都不歇",val:"now"},
    {label:"拿 N+1/失业金,休整一个月再战",val:"rest"},
    {label:"趁机考证充电,把被动变主动",val:"study"}];
  if(l.family>=7&&l.money>=30)opts.push({label:"不找了!收租/自由职业去",val:"free"});
  const pick=await chooseBtn("人生突然断电。你打算——",opts);
  if(pick==="now"){
    await getJob(l); l.salary=Math.max(5,Math.round(l.salary*.85));
    evS(`你接受了降薪 offer,年薪 ${l.salary} 万。成年人的世界没有容易二字。`);
  }else if(pick==="rest"){
    const s=+Math.min(4,sev*.15).toFixed(1); l.gain(s); l.happy+=6; l.jobHuntMod=.9;
    evN(`拿到 ${s} 万赔偿和失业金。你睡了半个月懒觉,陪了陪家人,然后重新打开招聘软件。`);
    await getJob(l); l.salary=Math.max(5,Math.round(l.salary*.85));
    evS(`重新上岸:年薪 ${l.salary} 万。`);
  }else if(pick==="study"){
    l.gain(-1); l.intel+=3; l.jobHuntMod=1.1;
    evS("三个月闭关,证书到手,简历又亮了一行。");
    await getJob(l); l.salary=Math.max(5,Math.round(l.salary*.9));
  }else{
    l.stage="自由职业"; l.job="自由职业";
    evS("你决定休息,做自由职业/收收租。");
  }
}

const MIL_RANKS=["列兵","上等兵","下士","中士","上士","四级军士长","三级军士长","少尉","中尉","上尉"];
const MIL_PAY=[1.2,1.5,5,6.5,8,10,12,11,13,15];
const MIL_BRANCHES={"陆军":{pay:1.0},"海军":{pay:1.15},"空军":{pay:1.1},"火箭军":{pay:1.1},"武警":{pay:1.0},"信息支援部队":{pay:1.05}};
function milDischarge(l,kind){
  let gold=+(1.5*l.milYears+2*l.milRank).toFixed(1);
  if(kind==="bad")gold=+(gold*.5).toFixed(1);
  if(kind==="zhuanye")gold=+(gold*1.5).toFixed(1);
  l.gain(gold); l.tag("退伍军人");
  l.milBranch=null; l.milRank=0; l.milYears=0; l.milInRank=0; l.milMerit=0;
  return gold;
}
async function militaryYearChoice(l){
  const opts=[
    {label:"拼命训练,争当训练标兵",fx:()=>{l.health+=3;l.fame+=3;l.milMerit=1;evS("战术、体能、射击,样样冲在最前面。连长记住了你的名字。");}},
    {label:"钻研军事技术,考专业技能证书",fx:()=>{l.intel+=3;evS("雷达、通信、装甲维修——一门技术,走到哪都有饭吃。");}},
    {label:"踏实站岗,平安服役",fx:()=>{l.happy+=3;evS("站好每一班岗,写好每一篇思想汇报。");}},
    {label:"把津贴寄回家,当兵也要顾家",fx:()=>{const v=+(MIL_PAY[l.milRank]*.3).toFixed(1);l.familyWealth=+((l.familyWealth||0)+v).toFixed(1);l.happy+=2;evN(`你把 ${v} 万津贴寄回家,妈嘴上说别乱花,转头存了定期。`);}}];
  const pick=await chooseBtn(null,rnd.shuffle(opts).map((o,i)=>({label:o.label,val:i})));
  opts[pick].fx();
}
async function militaryYear(l){
  l.milYears++; l.milInRank++;
  const br=MIL_BRANCHES[l.milBranch]||{pay:1};
  const pay=+(MIL_PAY[l.milRank]*br.pay).toFixed(1);
  l.gain(pay);
  evDim(`🎖️ 服役第 ${l.milYears} 年(${l.milBranch}·${MIL_RANKS[l.milRank]}):津贴 ${pay} 万,吃住全包。`);
  // 违纪/身体原因提前退役
  if(rnd.chance(.025)){
    const gold=milDischarge(l,"bad");
    evD(`⚠️ ${rnd.pick(["训练伤病复发,体检复查不合格","严重违纪被处分退伍"])}。你提前脱下了军装,拿走 ${gold} 万。`);
    l.happy-=8; l.log("提前退役");
    if(l.age<=30){l.stage="大学";evS("你回到人生岔路口。");}else{l.stage="职场";await getJob(l);}
    return;
  }
  await militaryYearChoice(l);
  // 士兵提干(本科+年轻+优秀)
  if(l.edu>=6&&l.age<=26&&l.milRank<7&&rnd.chance(.08+(l.milMerit?.08:0))){
    l.milRank=7; l.milInRank=0; l.fame+=6;
    evM("🎓 士兵提干!保送军校——肩章换成了'一杠一星',少尉报到!");
    l.log("提干成为军官"); l.milMerit=0; return;
  }
  // 晋升判定(不会每年发生)
  if(l.milRank===0&&l.milYears>=1){l.milRank=1;evG("🎖️ 列兵晋升上等兵。第两年了,你已经是老兵。");}
  else if(l.milRank===1&&l.milYears>=2){
    const pick=await chooseBtn("两年义务兵期满——",[
      {label:"退伍:拿退伍金,回到人生岔路口",val:"out"},
      {label:"争取套改士官:留队长期发展",val:"stay"}]);
    if(pick==="out"){
      const gold=milDischarge(l,"ok");
      evM(`🎒 你退伍了,拿回 ${gold} 万退伍金。军装叠成豆腐块,塞进行李箱。`);
      l.stage="大学"; evS("你回到人生岔路口——这一次,简历上多了一行别人没有的字。");
      return;
    }
    if(rnd.chance(.55+l.health/400+l.intel/400+(l.milMerit?.15:0))){
      l.milRank=2; l.milInRank=0; l.gain(1);
      evM("🎖️ 套改成功!你留队转为下士——从此军装是职业,不是经历。"); l.log("套改下士");
    }else{
      const gold=milDischarge(l,"ok");
      evD(`套改名额没轮到你。你退伍了,拿回 ${gold} 万,回到人生岔路口。`);
      l.stage="大学"; return;
    }
  }
  else if(l.milRank>=2&&l.milRank<=5&&l.milInRank>=3){
    if(rnd.chance(.45+l.intel/300+l.health/400+(l.milMerit?.15:0))){
      l.milRank++; l.milInRank=0;
      evM(`🎖️ 晋级成功:${MIL_RANKS[l.milRank]}!工资条和责任都重了一格。`); l.log(`晋升${MIL_RANKS[l.milRank]}`);
    }else{

/* ---------------- 零花钱 / 生活费 / 补贴 ---------------- */
function familyGive(l, want){
  // 家庭能否给得起:钱不够时打折扣或拒绝
  const fw=l.familyWealth||0;
  if(fw < want*0.6) return 0;           // 家里真没钱
  const give=Math.min(want, +(fw*0.5).toFixed(1));
  l.familyWealth=+(fw-give).toFixed(1);
  l.gain(give);
  return give;
}

const CITIES=[
  {name:"一线城市", prices:[300,380,450]},
  {name:"新一线/二线城市", prices:[120,160,200]},
  {name:"环京/环沪小城市", prices:[70,90,110]},
  {name:"老家县城/三四线", prices:[40,60,80]},
];
function chooseCity(l){
  if(l.hometown)return CITIES[3];
  const t=l.eduTier||l.uniTier;
  if(l.family>=8||(t>=4&&l.salary>=30))return CITIES[0];
  if(l.salary>=15||t>=3)return rnd.chance(.5)?CITIES[1]:CITIES[2];
  return CITIES[3];
}
/* 返回报价对象(城市+价格),把成交价锁进选项,避免"看到价、按下去另一价" */
function houseQuote(l){
  const city=chooseCity(l);
  return {city:city.name, price:rnd.pick(city.prices)};
}
function life_income_factor(l){
  if(l.stage==="退休"||l.age>=60)return .2;
  if(l.stage==="自由职业")return .8;
  return 1;
}
function totalAssets(l){
  let v=l.money||0;
  const price=Math.round((l.cityPrice||100)*(l.priceIdx||1));
  if(l.house>=1)v+=price;                 // 房产市值
  if(l.house===2)v-=(l.houseDebt||0);     // 减去未还贷款
  if(l.house2)v+=Math.round(price*.95);    // 第二套
  if(l.car)v+=8;
  return Math.round(v);
}

        else{const debt=rnd.i(1,5);l.gain(-debt);evD(`办完丧事,你还替父母还清了 ${debt} 万的老账。`);l.log("替父母还债");}
      }

  }

  if(rnd.chance(.008+l.luck/20000)){

  }
}

      {label:"幼儿园接送员,肩膀上扛着全家的排班",cond:x=>x.kids>0,val:5},
      {label:"和老伴报'夕阳团':坝上看秋",val:6},
      {label:"阳台菜地,番茄吃出了小时候的味道",val:7},
      {label:"社区志愿:红马甲巡逻队",val:8},
      {label:"替闺女去公园相亲角交资料——她都嫌你急",cond:x=>x.kids>0&&x.age<=75,val:9},
      {label:"每月一次老同事麻将/乒乓局",val:10},
      {label:"写回忆录:把家族往事留给孙辈",val:11},
      {label:"收编一只要扑杀的猫,成了它孙子",val:12},
      {label:"给老伴织了条围巾,扎手但暖",cond:x=>x.married,val:13}];
    const opts=pickOptions(l,EPOOL,rnd.i(3,4));
    const k=await chooseBtn("🌇 这一年,你把心思花在——",opts.map(o=>({label:o.label,val:o.val})));
    const EFF={0:()=>{l.health+=3;l.happy+=2;},1:()=>{l.happy+=4;l.health+=2;l.fame+=1;},
      2:()=>{l.happy+=3;},3:()=>{l.intel+=2;l.happy+=3;},4:()=>{l.fame+=4;l.happy+=3;},
      5:()=>{l.happy+=5;l.health-=1;},6:()=>{l.gain(-1.5);l.happy+=8;},7:()=>{l.happy+=3;l.gain(.2);},
      8:()=>{l.fame+=3;l.happy+=3;},9:()=>{l.happy+=2;},10:()=>{l.happy+=4;l.gain(-.3);},
      11:()=>{l.happy+=6;l.fame+=2;},12:()=>{l.happy+=5;l.gain(-.3);},13:()=>{l.happy+=5;l.health+=1;}};
    (EFF[k]||(()=>{}))();
    if(k===9)evDim("闺女嘴上说'别瞎操心',周末却回家吃了顿饭。");
    if(k===5)evDim("接送准点率 100%,你在小区家长圈一战成名。");
    if(k===11)evDim("写了三万字,老伴看完第一句:'把我和奶奶写好看点。'");
  }
  let decay=.4+(l.age-60)*.035;
  if(l.happy<30)decay+=1;
  if(l.happy>=70)decay*=.5;
  l.health-=decay;
  if(rnd.chance(.4)){const [t,f]=rnd.pick(ELDER_EVENTS); evDim("· "+t); f(l);}
  if(l.age>=72&&rnd.chance(.06+(l.age-72)*.012)){evD("🏥 高血压、糖尿病、关节……慢性病常驻名单。");l.health-=5;}
  if(l.married&&l.spouse&&l.age>=74&&rnd.chance(.05)){
    evD(`那年秋天,${l.spouse}先你一步走了。你保留了TA常坐的那把椅子,谁也不许动。`);
    l.married=false; l.spouse=null; l.happy-=12; l.widowed=true; l.log("丧偶");
  }
  if([80,90,100,110].includes(l.age)){
    const reward={80:2,90:5,100:12,110:30}[l.age];
    l.gain(reward); l.happy+=10; l.tag(l.age+"岁寿星");
    evM(`🎂 八十/九十/百岁宴!${l.age}岁大寿,区领导都来给你戴红花,长寿补贴 +${reward} 万。`);
    l.log(`${l.age} 岁大寿`);
  }
  if(rnd.chance(.012+(l.age-60)*.0035+Math.max(0,50-l.health)/50*.06)){
    evD(rnd.pick(["一场冬天普通的肺炎,这次没扛过去。","清晨遛弯时你在长椅上睡了过去,手里还攥着老伴的手。",
    "脑溢血来得很快,家人只来得及看你最后一眼。","你走了,很安详,像在午睡。"]));
    die(l,"年老病逝");
  }
}

/* ================================================================ 主循环 */
async function runYear(l){
  l.age++; l.funUsed=0;
  addYear(l.age);
  if(l.age<=5)await stageBaby(l);
  else if(l.age<=11)await stagePrimary(l);
  else if(l.age<=14)await stageMiddle(l);
  else if(l.age===15)await examZhongkao(l);
  else if(l.age<=17){
    if(l.hsType==="tech"&&l.age>=17){
      l.log("技校毕业"); l.edu=4; l.eduTier=1; l.stage="职场";
      evM("🛠️ 技校毕业,你带着技能证书走向社会。"); await getJob(l);
    }else if(l.hsType==="tech"||l.hsType==="zhuan5")await stageHigh(l);
    else{l.stage="高中"; await stageHigh(l);}
  }
  else if(l.age===18){
    if(["key","normal","private","abroad"].includes(l.hsType)){
      await examGaokao(l);
      if(l.score>0){await pickUniversity(l); l.stage="大学";}
    }
  }
  else if(l.age<=21){
    if(l.stage==="大学")await stageUniversity(l);
    else if(l.stage==="五年制大专"){
      evS("🏛️ 你在五年制大专里学技术,日子充实。"); l.intel+=3;
      if(l.age===20){l.edu=5;l.eduTier=1;l.log("五年制大专毕业");l.stage="职场";await getJob(l);}
    }
  }
  else{
    if(l.stage==="大学"){await afterUniversity(l);}
    else if(l.stage==="高中"){l.log("高中毕业");l.edu=3;await afterUniversity(l);}
    else if(l.stage==="研究生"){await stageGraduate(l); await gradCheck(l);}
  }
  await careerYear(l);
  await workYearChoice(l);
  if(l.age>=18){
    await loveYear(l); await marriageYear(l); await divorceCheck(l); await familyYear(l);
    kidEvents(l); await bigChoicesYear(l); await stageSpecial(l);
    await opportunityEvent(l); await lifeDecision(l);
    rollSmallEvent(l,.26);
    if(l.family>=6&&rnd.chance(.15))evDim("· "+rnd.pick(FAMILY_FLAVOR));
  }else{
    if(rnd.chance(.25))await opportunityEvent(l);
    await childAllowance(l);
  }
  if(l.age>=40||l.health<25){
    let decay=.25+Math.max(0,l.age-40)*.05;
    if(l.happy<35)decay+=1;
    if(l.happy>=70)decay*=.4;
    l.health-=decay;
  }else if(l.happy>=70)l.health=Math.min(100,l.health+.5);
  l.clampStats();
  const w=l.age<2?.3:l.age<40?.6:l.age<60?1.2:2.5;
  if(checkSuddenDeath(l,w))return;
  if(l.health<=0){evD("多年的消耗与疾病终于压垮了身体,你在病床上闭上了眼睛。");die(l,"健康耗尽");return;}
  if(l.age>=60&&!l.dead)await oldAgeYear(l);
  if(l.age===60&&!l.dead&&l.stage!=="研究生")await retire(l);
  updatePanel();
}

async function ending(l){
  hideAction();
  const title=l.age<35?"天妒英才":l.age<60?"短暂一生":l.age<80?"善终":"高寿";
  const assets=totalAssets(l);
  const score=Math.round(l.age*2+Math.min(120,assets)+l.happy+Math.floor(l.fame/2)+(l.married?20:0)+l.kids*10+l.edu*5+l.tags.length*6);
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`
    <h2>【 人 生 结 算 】</h2>
    <p style="font-size:16px"><b style="color:var(--gold)">${esc(l.name)}</b>(${l.gender}) · 享年 <b style="color:var(--gold)">${l.age} 岁</b></p>
    <p>死因:<span style="color:var(--red)">${esc(l.deathReason)}</span> · 出身:${FAMILY_NAMES[l.family]}之家</p>
    <p style="margin-top:8px">🎓 ${EDU_NAMES[l.edu]}${l.uni?"("+l.uni+(l.major?"·"+l.major:"")+")":""} · 💼 ${esc(l.job||l.lastJob||"无")} · 💰 净资产 <b style="color:var(--gold)">${fmtM(assets)}</b>(现金 ${l.money} 万${l.city?", "+l.city:""}${l.house?", 有房":""}${l.house2?", 另有出租屋":""}${l.car?", 有车":""})</p>
    <p>${l.married?("💍 配偶 "+esc(l.spouse)):(l.spouse?("❤ 恋人 "+esc(l.spouse)):"终身未婚")} · 👶 子女 ${l.kids} 人</p>
    <p>${l.tags.length?"🏅 人生标签:"+l.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(" "):""}</p>
    <p style="margin:14px 0 6px;color:var(--gold);font-size:16px">—— 生平大事记 ——</p>
    <div class="record">${l.records.map(r=>`<div><b>${r[0]} 岁</b>${esc(r[1])}</div>`).join("")}</div>
    <p style="margin-top:16px;font-size:18px">人生总分:<b style="color:var(--gold)">${score}</b> —— <b>${title}</b></p>
    <p style="margin-top:10px;color:var(--dim);font-size:13px">游戏结束。人生没有重开,但你可以再来一局。</p>`;
  const btn=document.createElement("button"); btn.className="btn cont bigbtn"; btn.textContent="🔄 再来一局";
  btn.onclick=()=>{ removeOverlay(); newGame(null); };
  ov.appendChild(btn);
  $("right").prepend(ov);
  try{localStorage.removeItem("life_save_"+SESSION_ID);}catch(e){}
}

async function runGame(l){
  while(!l.dead && l.age<130){
    await runYear(l); saveGame();
    if(!l.dead)await continueBtn(l);
  }
  if(!l.dead){evM("你已经超过 130 岁,作为隐藏结局,你被写进了新闻。");die(l,"活成了传说");}
  updatePanel();
  await ending(l);
}

/* ================================================================ 启动 */
async function newGame(resume){
  log.innerHTML="";
  if(resume){
    G=new Life(); Object.assign(G,reviveSave(resume));
    $("foot").textContent="▶ 已读取存档,继续你的人生。";
  }else{
    G=new Life();
    SESSION_ID="s"+Date.now().toString(36);
    addEv(`<b style="color:var(--gold)">${esc(G.name)}</b>(${G.gender}) · ${FAMILY_NAMES[G.family]}之家 · 命运已掷好骰子,祝你好运。`,"major");
    $("foot").textContent=AUTO?"🤖 自动演示中……":"点击选项按钮推进人生 · 进度自动存档(刷新后可继续)";
  }
  updatePanel();
  await runGame(G);
  AUTO=false;
}

function findSave(){
  try{
    let best=null;
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith("life_save_")){
        const raw=localStorage.getItem(k); if(!raw)continue;
        try{const s=JSON.parse(raw);
          if(s && !s.dead && typeof s.age==="number"){
            s._key=k;
            if(!best||(s.bornTs||0)>(best.bornTs||0))best=s;   // 取最新开局的那局
          }}catch(e){}
      }
    }
    return best;
  }catch(e){}
  return null;
}

window.addEventListener("DOMContentLoaded",()=>{
  const ov=document.createElement("div"); ov.className="overlay"; ov.id="startOverlay";
  ov.innerHTML=`
    <h2>《模拟人生:中国式人生》</h2>
    <p>从出生走到生命尽头:中考分叉、高考、大学、深造与就业、<br>
    婚恋买房买车、35 岁危机、退休养老……<br>
    每一个选择都由你<b style="color:var(--gold)">点</b>出来,年龄不设限,命运不保证。</p>
    <p style="margin-top:10px;color:var(--dim);font-size:12.5px">进度自动存档,关掉页面也能接着活。</p>`;
  const btnRow=document.createElement("div"); btnRow.style.cssText="display:flex;gap:12px;justify-content:center;flex-wrap:wrap";
  const start=document.createElement("button"); start.className="btn cont bigbtn"; start.textContent="🎲 投胎开始";
  start.onclick=()=>{ removeOverlay(); newGame(null); };
  btnRow.appendChild(start);
  const saved=findSave();
  if(saved){
    const cont=document.createElement("button"); cont.className="btn yes bigbtn";
    cont.textContent=`▶ 继续上一局(${saved.name} · ${saved.age}岁)`;
    cont.onclick=()=>{ removeOverlay(); SESSION_ID=(saved._key||"").replace("life_save_","")||SESSION_ID; newGame(saved); };
    btnRow.appendChild(cont);
  }
  const demo=document.createElement("button"); demo.className="btn no-btn bigbtn"; demo.style.fontSize="13px";
  demo.textContent="🤖 自动演示一局";
  demo.onclick=()=>{ removeOverlay(); AUTO=true; newGame(null); };
  btnRow.appendChild(demo);
  ov.appendChild(btnRow);
  $("right").prepend(ov);
  $("layout").classList.add("solo");
});
function removeOverlay(){
  const o=$("startOverlay"); if(o)o.remove();
  const e=document.querySelector(".overlay"); if(e)e.remove();
  $("layout").classList.remove("solo");
}
</script>
